name: Core build and tests
on: [push, pull_request]
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore EmployeeManagement.slnx
      - run: dotnet build EmployeeManagement.slnx -c Release --no-restore
      - run: dotnet test EmployeeManagement.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
